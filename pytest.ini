[pytest]
# Async tests must work without relying on the ambient plugin shape. Without this,
# `@pytest.mark.asyncio` is silently unknown and ~98 tests fail with
# "async def functions are not natively supported".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# A hung test must fail, not hang CI until the job limit. The suite previously
# blocked forever on tests that reached Hugging Face / loaded real diffusion.
timeout = 180
timeout_method = thread

filterwarnings =
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning
    ignore:There is no current event loop:DeprecationWarning

markers =
    heavy: needs real model weights or network access; excluded from the default run (see CI)
    slow: takes more than ~10s of real compute
