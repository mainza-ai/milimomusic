services:
  milimo:
    build:
      context: .
      dockerfile: Dockerfile
    image: milimomusic:latest
    container_name: milimo-music
    ports:
      - "8000:8000"
    volumes:
      - milimo-models:/app/models
      - milimo-data:/app/data
      - milimo-audio:/app/generated_audio
      - milimo-midi:/app/generated_midi
      - milimo-hf-cache:/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    environment:
      - MILIMO_IN_DOCKER=1
      - MILIMO_DATABASE_URL=sqlite:////app/data/jobs.db
      - HOST=0.0.0.0
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  milimo-models:
    driver: local
  milimo-data:
    driver: local
  milimo-audio:
    driver: local
  milimo-midi:
    driver: local
  milimo-hf-cache:
    driver: local
