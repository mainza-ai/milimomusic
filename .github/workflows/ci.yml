name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 fluidsynth

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          OPENCODE_API_KEY: "mock-ci-key"
          NVIDIA_API_KEY: "mock-ci-key"
          # Never reach the network or load real weights from the default suite.
          # Without these, three tests in test_production_v2.py block forever
          # waiting on Hugging Face.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          PYTHONPATH=backend:muscriptor:mulacover/src pytest backend/tests/ -v -m "not heavy"

      - name: Hermetic Suite (must not hang)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          PYTHONPATH=backend:muscriptor:mulacover/src pytest backend/tests/ -q -m "not heavy" \
            --timeout=180 --timeout-method=thread

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend & Typecheck
        working-directory: frontend
        run: npm run build
